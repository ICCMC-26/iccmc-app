<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ICCMC — سجل الموظفين</title>
<!--
  ICCMC v2 — "search IS the app".
  One box finds anyone by any field the OCR captured. Zero guidance: the search
  box is the single, obvious signifier; results appear as you type; no menus, no
  filter wall. Backend = the reused Supabase stack + the search_employees() RPC.
  (Design north star: V2.0/_guide/V2-RESEARCH.md)
-->
<link rel="stylesheet" href="assets/app.css?v=154">
</head>
<body>

<!-- ══ login gate ══ -->
<div id="gate">
  <div class="gate-card">
    <img class="gate-logo" src="assets/alamin-gate-logo.png?v=2" alt="ALAMIN">
    <div class="tag"><span class="dot"></span><span id="gtag">سجل وثائق الموظفين</span></div>
    <div class="field"><label>Email</label><input type="email" id="email" placeholder="you@iccmc.net" autocomplete="username" inputmode="email"></div>
    <div class="field"><label>Password</label><input type="password" id="pass" placeholder="••••••••" autocomplete="current-password"></div>
    <button class="btn primary" id="signin" style="width:100%;margin-top:6px">تسجيل الدخول ›</button>
    <div class="err-box" id="gerr"></div>
    <button class="gate-lang" id="glang">English</button>
    <div id="appver" style="margin-top:16px;font:11px/1 ui-monospace,monospace;letter-spacing:.06em;color:#7a8a86;opacity:.75">build …</div>
  </div>
</div>

<!-- one-stroke icon set for the header + search (currentColor, 24-grid). Referenced via <use href="#i-…">. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-board" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></symbol>
  <symbol id="i-scale" viewBox="0 0 24 24"><path d="m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1ZM2 16l3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1ZM7 21h10M12 3v18M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2"/></symbol>
  <symbol id="i-inbox" viewBox="0 0 24 24"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7.5"/><path d="m20.5 20.5-4.2-4.2"/></symbol>
  <symbol id="i-theme" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-power" viewBox="0 0 24 24"><path d="M12 3v9M18.4 6.6a9 9 0 1 1-12.8 0"/></symbol>
  <symbol id="i-filter" viewBox="0 0 24 24"><path d="M3 5h18l-7 8v6l-4 2v-8z"/></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="m8 12 3 3 5-6"/></symbol>
  <!-- the three document marks on every roster card: passport · visa · legal (one-stroke, tinted by state) -->
  <symbol id="d-pass" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><circle cx="12" cy="10" r="2.6"/><path d="M8 17c1-2 2.5-3 4-3s3 1 4 3"/></symbol>
  <symbol id="d-visa" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 12h18M8 9.5h3M8 14.5h6"/></symbol>
  <symbol id="d-legal" viewBox="0 0 24 24"><path d="M12 3v18M7 21h10M3 8h3c2 0 4-1 6-2 2 1 4 2 6 2h3"/><path d="m5 8-2.5 7c.7.6 1.6 1 2.5 1s1.8-.4 2.5-1L5 8ZM19 8l-2.5 7c.7.6 1.6 1 2.5 1s1.8-.4 2.5-1L19 8Z"/></symbol>
</svg>

<!-- ══ the app ══ -->
<div id="app">
  <div class="top">
    <span class="top-logo" role="img" aria-label="ICCMC"></span>
    <span class="spacer"></span>
    <button class="add" id="add"><svg class="ic"><use href="#i-plus"/></svg><span id="addtxt">إضافة</span></button>
    <button class="add quiet lawbtn" id="blaw" title="المعاملات القانونية / Legal procedures"><svg class="ic"><use href="#i-scale"/></svg><span id="blawtxt">المعاملات</span></button>
    <button class="add quiet pendbtn" id="bpend" title="الوارد — ما لم يُودَع بعد / Inbox — not committed yet"><svg class="ic"><use href="#i-inbox"/></svg><span id="bpendtxt">الوارد</span><span class="pq-badge" id="pq-badge" hidden>0</span></button>
    <button class="icon" id="tmore" title="المزيد / More" aria-haspopup="dialog" aria-expanded="false" aria-controls="msheet"><svg class="ic"><use href="#i-more"/></svg></button>
    <button class="icon" id="tlang" title="EN / ع">ع</button>
    <button class="icon" id="ttheme" title="فاتح / داكن"><svg class="ic"><use href="#i-theme"/></svg></button>
    <button class="icon" id="tout" title="خروج"><svg class="ic"><use href="#i-power"/></svg></button>
  </div>

  <!-- the filter lives IN the search box: tokens before the input, one «تصفية» button after it, the drawer beneath -->
  <div class="hero">
    <div class="sbox">
      <span class="mag"><svg class="ic"><use href="#i-search"/></svg></span>
      <span class="ftoks" id="ftoks"></span>
      <input id="q" autocomplete="off" spellcheck="false" placeholder="ابحث بالاسم أو الجواز أو التأشيرة…">
      <button class="fbtn" id="fbtn" type="button"><svg class="ic"><use href="#i-filter"/></svg><span id="fbtntxt">تصفية</span><span class="n" id="fbtn-n" hidden>0</span></button>
    </div>
    <div class="fpanel" id="fpanel" hidden></div>
    <!-- the brief (v280): slides down from under the search box after sign-in; see app.js «THE BRIEF» -->
    <div class="brief-slot" id="brief-slot" hidden><div class="brief" id="brief"></div></div>
  </div>
  <div class="brief-strip" id="brief-strip" hidden></div>

  <div class="filters" id="filters"></div>
  <div class="listbar"><div class="lb-start"><button class="sel-chip" id="bsel" title="تحديد موظفين / Select employees"><svg class="ic"><use href="#i-check"/></svg><span id="bseltxt">تحديد</span></button><div class="count" id="count"></div></div><span class="legend" id="legend" hidden></span><div class="sortbar" id="sortbar"></div></div>
  <div id="results"></div>
  <!-- the Al-Amin crown seal closes the list («المسلّة», decorative only) -->
  <div class="crownseal-line" aria-hidden="true" style="text-align:center;padding:26px 0 4px"><svg viewBox="0 0 200 60" style="height:11px;width:auto;color:var(--copper);opacity:.9"><path fill="currentColor" d="M0 0h200l-6 14H6zM14 20h172l-5 12H19zM30 38h140v10H30z"/></svg></div>
</div>

<!-- the board: a separate page, not a panel on the roster -->
<div id="board"></div>

<div id="detail"></div>
<div id="lightbox"></div>
<div id="print"></div>

<!-- ══ add-employee intake (drop zone → Storage → OCR line) ══ -->
<div id="intake">
  <div class="ik-bar">
    <span class="ik-h">＋ <span id="ik-h">إضافة</span></span>
    <span class="spacer"></span>
    <button class="icon ik-close" title="إغلاق">✕</button>
  </div>
  <div class="ik-scroll">
    <label class="dz" id="dz" for="dz-input">
      <div class="dz-ic">⬆</div>
      <div class="dz-t" id="dz-t">اسحب ملفات الموظف هنا</div>
      <div class="dz-s" id="dz-s">أو انقر للاختيار · صورة أو PDF · ملفات كبيرة مدعومة · عدة ملفات وموظفين معًا</div>
      <input type="file" id="dz-input" multiple accept="image/*,application/pdf,.xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,.docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document" hidden>
    </label>
    <!-- OUTSIDE the label on purpose: nested in it, a click would also open the file picker. -->
    <a class="dz-agent" href="ICCMC-uploader.pyw" download="افتح أداة الرفع.pyw"><span class="dz-agent-i">⤓</span><span id="dz-agent-t">أكثر من 12 ملفًا؟ حمِّل أداة الرفع — الطابور يصير مجلدًا على قرصك</span></a>
    <div id="ik-list"></div>
    <div id="ik-foot"></div>
  </div>
</div>

<!-- ══ THE QUEUE — a window onto the database, not onto this browser ══════════════════════
     Everything here is read from v_intake_ledger, so closing the tab or refreshing changes
     only what is displayed. Two buckets: قيد المراجعة (work owed) and مرفوض (with reasons). -->
<div id="pend">
  <div class="ik-bar">
    <span class="ik-h">📥 <span id="pq-bar-h">قائمة المراجعة</span></span>
    <span class="spacer"></span>
    <button class="icon" id="pq-refresh" title="تحديث">⟳</button>
    <button class="icon pq-close" title="إغلاق">✕</button>
  </div>
  <div class="ik-scroll">
    <!-- WHERE AM I: a named header that changes with the bucket, so the section identifies
         itself instead of leaving the user to infer it from which chip looks selected. -->
    <div class="pq-hero">
      <div class="pq-hero-ic" id="pq-hero-ic">⏳</div>
      <div>
        <div class="pq-hero-t" id="pq-hero-t">قيد المراجعة</div>
        <div class="pq-hero-s" id="pq-hero-s"></div>
      </div>
    </div>
    <div class="filters" id="pq-buckets"></div>
    <div class="filters pq-kinds" id="pq-kinds"></div>
    <div class="listbar"><div class="count" id="pq-count"></div></div>
    <div id="pq-list"></div>
    <div id="pq-pager"></div>
  </div>
</div>

<div id="toast"></div>

<!-- ══ quick-review page — a stuck pic gets checked & inserted here, in-app ══ -->
<div id="ikreview"></div>

<!-- ══ legal-batch composer — build & commit one منح/تعهد/استمارة set as a batch ══ -->
<div id="legalform"></div>

<!-- ══ استمارة/تعهد BUILDER — WYSIWYG government-form workspace (header fields + photo + OCR-fed table) ══ -->
<div id="istimara"></div>

<script src="assets/vendor.js?v=1"></script>
<!-- pdf.js — rasterizes a PDF passport/visa scan into a printable image for the dossier -->
<!-- pdf.js is lazy-loaded on first PDF need (ensurePdfjs in app.js) -->
<script src="assets/app.js?v=305"></script>
</body>
</html>
